name: Build StosDebug IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project
        run: |
          xcodebuild -project StosDebug.xcodeproj -list

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project StosDebug.xcodeproj \
            -scheme StosDebug \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StosDebug.app Payload/
          zip -r StosDebug.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StosDebug-IPA
          path: StosDebug.ipa
